{% extends 'layout.html' %}{% block content %}<h1>Daftar bot sedia ada</h1><p>Pendaftaran ini tidak mencipta folder, push GitHub atau deploy.</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post" class="card"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>Kod CLI <input name="cli_code" placeholder="CLI-1000" required></label><label>Username bot dalam DB <input name="username" required></label><label>Server <select name="server_id">{% for s in servers %}<option value="{{ s.id }}">{{ s.id }}</option>{% endfor %}</select></label><label>Slot (1–4) <input type="number" min="1" max="4" name="bot_slot" required></label><label>URL bot Railway <input type="url" name="bot_url"></label><label>URL dashboard Vercel <input type="url" name="vercel_url"></label><button>Daftar</button></form>{% endblock %}
