{% extends 'layout.html' %}{% block content %}
<h1>Daftar klien sedia ada</h1>
<p>Gunakan username yang tepat dalam Master DB. Pendaftaran ini tidak mencipta rekod klien, folder bot atau deployment. Server dan slot ditentukan oleh kod CLI.</p>
{% if error %}<p role="alert" class="form-alert">{{ error }}</p>{% endif %}
<form method="post" class="card registration-card">
  <input type="hidden" name="csrf" value="{{ session.csrf }}">
  <label>Kod CLI <input name="cli_code" value="{{ request.form.get('cli_code', 'CLI-1000') }}" pattern="CLI-1[01][0-9]{2}" required></label>
  <label>Username DB klien sedia ada <input name="username" value="{{ request.form.get('username', '') }}" pattern="[a-z0-9_]{3,100}" required></label>
  <label>URL bot Railway (pilihan) <input type="url" name="bot_url" value="{{ request.form.get('bot_url', '') }}"></label>
  <label>URL portal Vercel (pilihan; biarkan kosong jika belum ada) <input type="url" name="vercel_url" value="{{ request.form.get('vercel_url', '') }}"></label>
  <button type="submit">Daftar klien sedia ada</button>
</form>
{% endblock %}
