{% extends 'layout.html' %}{% block content %}<h1>Create Dashboard</h1><p>Salin fail sahaja. Vercel URL tidak direkod sehingga deployment disahkan. Pastikan template bebas rahsia klien asal.</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post" class="card"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>Klien <select name="cli_code" required>{% for c in clients %}<option value="{{ c.cli_code }}">{{ c.cli_code }} — {{ c.username }}</option>{% endfor %}</select></label><label>Tajuk <input name="title" maxlength="100" required></label><label>Logo HTTPS <input name="logo" type="url"></label><label>Warna <input name="color" type="color" value="#8b5cf6"></label><label>Tema <select name="theme"><option>dark</option><option>light</option></select></label><button {% if not clients %}disabled{% endif %}>Sediakan fail</button></form>{% endblock %}
