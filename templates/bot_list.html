{% extends 'layout.html' %}{% block content %}<h1>Senarai bot ber-URL</h1><p>URL direkodkan, bukan pengesahan status deployment atau kesihatan bot.</p><div class="card"><table><thead><tr><th>Kod</th><th>Server</th><th>URL direkodkan</th></tr></thead><tbody>{% for bot in bots %}<tr><td>{{ bot.cli_code }}</td><td>{{ bot.server_id }}</td><td>{{ bot.bot_url }}</td></tr>{% else %}<tr><td colspan="3">Tiada bot ber-URL.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
